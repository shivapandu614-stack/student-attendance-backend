spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/student_attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-before-deployment-123456}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
